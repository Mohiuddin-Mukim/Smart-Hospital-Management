spring:
  application:
    name: hospital-management
  datasource:
    url: jdbc:mysql://localhost:3306/management?createDatabaseIfNotExist=true
    username: root
    password: MyPassword123@
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.use_sql_comments: true
      org.hibernate.envers.store_data_at_delete: true

  flyway:
    baseline-on-migrate: true
    repair-on-migrate: true


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE


app:
  jwt:
    secret: ${JWT_SECRET:TMukimiiSecretKeyyeKterceSiimikuMTTahiraJahanHimiiiiiiiiSoitisalongkeynow}
    expiration-ms: 36000000   # 10 hours in milliseconds
  admin:
    email: ${ADMIN_EMAIL:superadmin@hospital.com}
    password: ${ADMIN_PASSWORD:Admin@12345}

sslcommerz:
  api:
    base_url: "https://sandbox.sslcommerz.com/gwprocess/v4/api.php"
    store_id: ${SSLCOMMERZ_STORE_ID:testbox}
    store_password: ${SSLCOMMERZ_STORE_PASSWORD:qwerty}
    is_sandbox: true

